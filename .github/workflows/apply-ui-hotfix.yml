name: Apply UI hotfix

on:
  push:
    branches:
      - work/ui-polish-streaming
    paths:
      - .github/workflows/apply-ui-hotfix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ui-polish-streaming

      - name: Apply streaming scroll and API layout fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/ayuemin/disputeai/MainActivity.kt')
          text = path.read_text()

          old_scroll = '''    LaunchedEffect(chat?.messages?.size, chat?.messages?.lastOrNull()?.text?.length, showResult) {
              val count = chat?.messages?.size ?: 0
              if (count > 0) {
                  val target = if (showResult) count else count - 1
                  listState.animateScrollToItem(target.coerceAtLeast(0))
              }
          }
          '''
          new_scroll = '''    LaunchedEffect(chat?.messages?.size, showResult) {
              val count = chat?.messages?.size ?: 0
              if (count > 0) {
                  val target = if (showResult) count else count - 1
                  listState.animateScrollToItem(target.coerceAtLeast(0))
              }
          }
          '''

          old_buttons = '''        Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
            Button(
                onClick = { if (apiKey.isNotBlank()) { onSaveKey(apiKey); apiKey = "" } },
                enabled = apiKey.isNotBlank()
            ) { Text("Сохранить ключ") }
            if (profile.hasApiKey) TextButton(onClick = onClearKey) { Text("Удалить ключ") }
            Spacer(Modifier.weight(1f))
            TextButton(onClick = onDelete) { Text("Удалить подключение") }
        }
          '''
          new_buttons = '''        Button(
            onClick = { if (apiKey.isNotBlank()) { onSaveKey(apiKey); apiKey = "" } },
            enabled = apiKey.isNotBlank(),
            modifier = Modifier.fillMaxWidth()
        ) { Text("Сохранить ключ") }
        if (profile.hasApiKey) {
            OutlinedButton(
                onClick = onClearKey,
                modifier = Modifier.fillMaxWidth()
            ) { Text("Удалить ключ") }
        }
        OutlinedButton(
            onClick = onDelete,
            modifier = Modifier.fillMaxWidth()
        ) {
            Icon(Icons.Default.Delete, null)
            Spacer(Modifier.width(8.dp))
            Text("Удалить подключение")
        }
          '''

          if text.count(old_scroll) != 1:
              raise SystemExit(f'Expected one scroll block, found {text.count(old_scroll)}')
          if text.count(old_buttons) != 1:
              raise SystemExit(f'Expected one API button block, found {text.count(old_buttons)}')

          text = text.replace(old_scroll, new_scroll)
          text = text.replace(old_buttons, new_buttons)
          path.write_text(text)
          PY

          git rm .github/workflows/apply-ui-hotfix.yml
          git config user.name "Ayuemin"
          git config user.email "105455063+Ayuemin@users.noreply.github.com"
          git add app/src/main/java/com/ayuemin/disputeai/MainActivity.kt
          git commit -m "Fix streaming scroll and API actions layout"
          git push origin HEAD:work/ui-polish-streaming
