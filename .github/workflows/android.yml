name: Android CI

on:
  push:
    branches:
      - main
      - 'work/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Apply 1.3.2 source patch
        if: github.event_name == 'push' && github.ref == 'refs/heads/work/ui-polish-streaming' && contains(github.event.head_commit.message, '[bootstrap-132]')
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          main = Path('app/src/main/java/com/ayuemin/disputeai/MainActivity.kt')
          text = main.read_text()

          old_scaffold = '''            Scaffold(
                contentWindowInsets = WindowInsets(0, 0, 0, 0),
                snackbarHost = { SnackbarHost(snack) }
            ) { padding ->
                ChatScreen(
                    state = state,
                    vm = vm,
                    onMenu = {
                        keyboard?.hide()
                        scope.launch { drawerState.open() }
                    },
                    modifier = Modifier.padding(padding)
                )
            }
'''
          new_scaffold = '''            Scaffold(
                contentWindowInsets = WindowInsets(0, 0, 0, 0)
            ) { padding ->
                ChatScreen(
                    state = state,
                    vm = vm,
                    onMenu = {
                        keyboard?.hide()
                        scope.launch { drawerState.open() }
                    },
                    modifier = Modifier.padding(padding)
                )
            }

            SnackbarHost(
                hostState = snack,
                modifier = Modifier
                    .align(Alignment.TopCenter)
                    .statusBarsPadding()
                    .padding(start = 16.dp, end = 16.dp, top = 58.dp)
                    .widthIn(max = 520.dp)
            ) { data ->
                Surface(
                    shape = RoundedCornerShape(14.dp),
                    color = MaterialTheme.colorScheme.secondaryContainer,
                    contentColor = MaterialTheme.colorScheme.onSecondaryContainer,
                    tonalElevation = 6.dp
                ) {
                    Text(
                        data.visuals.message,
                        style = MaterialTheme.typography.bodyMedium,
                        modifier = Modifier.padding(horizontal = 16.dp, vertical = 12.dp)
                    )
                }
            }
'''

          old_render = '''                        if (isUser) {
                            Text(message.text, style = MaterialTheme.typography.bodyLarge)
                        } else {
                            MarkdownText(message.text, modifier = Modifier.fillMaxWidth())
                        }
'''
          new_render = '''                        if (isUser) {
                            Text(message.text, style = MaterialTheme.typography.bodyLarge)
                        } else if (message.inProgress) {
                            Text(
                                message.text,
                                style = MaterialTheme.typography.bodyLarge,
                                modifier = Modifier.fillMaxWidth()
                            )
                        } else {
                            MarkdownText(message.text, modifier = Modifier.fillMaxWidth())
                        }
'''

          if text.count(old_scaffold) != 1:
              raise SystemExit(f'Expected one scaffold block, found {text.count(old_scaffold)}')
          if text.count(old_render) != 1:
              raise SystemExit(f'Expected one render block, found {text.count(old_render)}')

          text = text.replace(old_scaffold, new_scaffold)
          text = text.replace(old_render, new_render)
          main.write_text(text)

          gradle = Path('app/build.gradle')
          g = gradle.read_text()
          old_version = "        versionCode 8\n        versionName '1.3.1'"
          new_version = "        versionCode 9\n        versionName '1.3.2'"
          if g.count(old_version) != 1:
              raise SystemExit('Expected 1.3.1 version block once')
          gradle.write_text(g.replace(old_version, new_version))

          changelog = Path('CHANGELOG.md')
          c = changelog.read_text()
          marker = '# Changelog\n\n'
          entry = '''## 1.3.2

- Во время streaming ответ отображается как обычный текст без повторного тяжёлого Markdown-рендеринга; после завершения ответ один раз преобразуется в полноценный Markdown.
- Убрано мерцание длинных streaming-ответов и таблиц при поступлении новых фрагментов.
- Внутренние уведомления приложения перенесены наверх и оформлены компактной тёмной плашкой, чтобы не перекрывать поле ввода.

'''
          if not c.startswith(marker):
              raise SystemExit('Unexpected changelog header')
          if '## 1.3.2' in c:
              raise SystemExit('1.3.2 changelog already exists')
          changelog.write_text(marker + entry + c[len(marker):])
          PY

          git checkout HEAD^ -- .github/workflows/android.yml
          git diff --check
          grep -q "versionName '1.3.2'" app/build.gradle
          grep -q 'else if (message.inProgress)' app/src/main/java/com/ayuemin/disputeai/MainActivity.kt
          grep -q 'Alignment.TopCenter' app/src/main/java/com/ayuemin/disputeai/MainActivity.kt

          git config user.name "Ayuemin"
          git config user.email "105455063+Ayuemin@users.noreply.github.com"
          git add .github/workflows/android.yml app/src/main/java/com/ayuemin/disputeai/MainActivity.kt app/build.gradle CHANGELOG.md
          git commit -m "Fix streaming rendering and notice placement"
          git push origin HEAD:work/ui-polish-streaming

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DisputeAI-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare release signing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || \
             [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || \
             [ -z "$ANDROID_KEY_ALIAS" ] || \
             [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Permanent release-signing secrets are missing. Refusing to publish an unsigned/debug-signed stable release." >&2
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/disputeai-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -alias "$ANDROID_KEY_ALIAS" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null

          echo "DISPUTEAI_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "DISPUTEAI_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "DISPUTEAI_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "DISPUTEAI_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify release APK signature
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found" >&2
            exit 1
          fi

          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Prepare release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME=$(grep -o "versionName '[^']*'" app/build.gradle | cut -d"'" -f2)
          if [ -z "$VERSION_NAME" ]; then
            echo "Cannot determine versionName" >&2
            exit 1
          fi

          SOURCE_APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$SOURCE_APK"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          cp "$SOURCE_APK" "DisputeAI-${VERSION_NAME}.apk"

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v${VERSION_NAME}"
          NOTES_FILE=$(mktemp)
          {
            echo "## DisputeAI ${VERSION_NAME}"
            echo
            awk -v version="$VERSION_NAME" '
              $0 == "## " version { found=1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md
            echo
            echo "> APK подписан постоянным release-ключом проекта."
          } > "$NOTES_FILE"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "DisputeAI-${VERSION_NAME}.apk" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "DisputeAI ${VERSION_NAME}" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" "DisputeAI-${VERSION_NAME}.apk" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "DisputeAI ${VERSION_NAME}" \
              --notes-file "$NOTES_FILE"
          fi
