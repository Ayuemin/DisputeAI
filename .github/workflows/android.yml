name: Android CI

on:
  push:
    branches:
      - main
      - 'work/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DisputeAI-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
        shell: bash
        run: |
          VERSION_NAME=$(grep -o "versionName '[^']*'" app/build.gradle | cut -d"'" -f2)
          if [ -z "$VERSION_NAME" ]; then
            echo "Cannot determine versionName" >&2
            exit 1
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/debug/app-debug.apk "DisputeAI-${VERSION_NAME}.apk"

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v${VERSION_NAME}"
          NOTES_FILE=$(mktemp)
          cat > "$NOTES_FILE" <<'EOF'
          ## DisputeAI 1.1.0

          Первый полноценный нативный релиз DisputeAI на Jetpack Compose.

          ### Главное
          - дискуссия из двух и более независимо настраиваемых моделей;
          - отдельная модель результата для нейтрального финального ответа;
          - пауза, продолжение и остановка цикла;
          - пользовательские реплики и вложения во время дискуссии;
          - содержимое вложений передаётся модели только по запросу, а не на каждом ходе;
          - системный промпт, температура, таймаут и reasoning настраиваются отдельно для каждой модели;
          - reasoning показывается только для поддерживающих его моделей;
          - история чатов, поиск, закрепление, переименование и удаление;
          - боковая панель открывается кнопкой и расширенным свайпом от левой части экрана;
          - API-ключи защищены Android Keystore;
          - внешний API требует HTTPS, локальный HTTP ограничен безопасным сценарием разработки;
          - старый WebView-интерфейс полностью удалён.

          ### Требования
          Android 7.0 и новее.

          > APK этого релиза собран GitHub Actions из исходников тега релиза.
          EOF

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "DisputeAI-${VERSION_NAME}.apk" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "DisputeAI ${VERSION_NAME}" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" "DisputeAI-${VERSION_NAME}.apk" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "DisputeAI ${VERSION_NAME}" \
              --notes-file "$NOTES_FILE"
          fi
