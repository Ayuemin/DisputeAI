name: Android CI

on:
  push:
    branches:
      - main
      - 'work/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DisputeAI-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare release signing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && \
             [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && \
             [ -n "$ANDROID_KEY_ALIAS" ] && \
             [ -n "$ANDROID_KEY_PASSWORD" ]; then
            KEYSTORE_PATH="$RUNNER_TEMP/disputeai-release.jks"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            echo "DISPUTEAI_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "DISPUTEAI_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "DISPUTEAI_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "DISPUTEAI_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "RELEASE_SIGNING_READY=true" >> "$GITHUB_ENV"
          else
            echo "RELEASE_SIGNING_READY=false" >> "$GITHUB_ENV"
            echo "Persistent release-signing secrets are not configured; using the CI debug-signed APK for this release."
          fi

      - name: Build signed release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]') && env.RELEASE_SIGNING_READY == 'true'
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Prepare release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
        shell: bash
        run: |
          VERSION_NAME=$(grep -o "versionName '[^']*'" app/build.gradle | cut -d"'" -f2)
          if [ -z "$VERSION_NAME" ]; then
            echo "Cannot determine versionName" >&2
            exit 1
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

          if [ "$RELEASE_SIGNING_READY" = "true" ] && [ -f app/build/outputs/apk/release/app-release.apk ]; then
            SOURCE_APK=app/build/outputs/apk/release/app-release.apk
            echo "RELEASE_APK_SIGNED=true" >> "$GITHUB_ENV"
          else
            SOURCE_APK=app/build/outputs/apk/debug/app-debug.apk
            echo "RELEASE_APK_SIGNED=false" >> "$GITHUB_ENV"
          fi

          cp "$SOURCE_APK" "DisputeAI-${VERSION_NAME}.apk"

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v${VERSION_NAME}"
          NOTES_FILE=$(mktemp)
          {
            echo "## DisputeAI ${VERSION_NAME}"
            echo
            awk -v version="$VERSION_NAME" '
              $0 == "## " version { found=1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md
            echo
            if [ "$RELEASE_APK_SIGNED" = "true" ]; then
              echo "> APK подписан постоянным release-ключом проекта."
            else
              echo "> APK этого релиза собран текущим CI. Постоянная release-подпись будет использоваться после настройки signing secrets."
            fi
          } > "$NOTES_FILE"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "DisputeAI-${VERSION_NAME}.apk" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "DisputeAI ${VERSION_NAME}" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" "DisputeAI-${VERSION_NAME}.apk" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "DisputeAI ${VERSION_NAME}" \
              --notes-file "$NOTES_FILE"
          fi
